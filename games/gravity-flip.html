<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d1b"><title>Gravity Flip — NOVA ARCADE</title><style>
*{box-sizing:border-box}body{margin:0;color:#f5f7ff;font:15px system-ui,sans-serif;background:radial-gradient(ellipse at 50% -20%,#25365c,#090d1b 65%)}a{color:#b5ff86;text-decoration:none}main{width:min(940px,94vw);margin:20px auto 60px}.top{display:flex;align-items:center;justify-content:space-between;padding:12px 0 24px}.brand{font-size:20px;font-weight:950;letter-spacing:-1px}.brand span{color:#b5ff86}h1{font-size:clamp(42px,7vw,64px);margin:24px 0 4px;letter-spacing:-2px}p{color:#b3bfd9}.frame{margin-top:25px;background:#111a2f;border:1px solid #40506e;padding:14px;border-radius:22px;box-shadow:0 24px 80px #000a}.hud{display:flex;justify-content:space-between;padding:9px 14px 14px;font-weight:800;color:#c3d4ee}.hud b{color:#c3a3ff}canvas{width:100%;height:auto;display:block;background:#070c19;border-radius:15px;touch-action:none}button{border:1px solid #61708e;color:#fff;background:#263650;padding:13px 23px;border-radius:11px;font-weight:900;cursor:pointer}.primary{background:#c3a3ff;border-color:#c3a3ff;color:#101827}.actions{display:flex;justify-content:center;gap:12px;padding:17px}.tip{text-align:center;font-size:13px;min-height:23px}.foot{font-size:13px;margin-top:24px}@media(max-width:550px){.frame{padding:7px}.actions button{padding:12px}}</style></head><body><main><div class="top"><a class="brand" href="../index.html">NOVA<span>ARCADE.</span></a><a href="../index.html">← ALL GAMES</a></div><h1>Gravity Flip</h1><p>Switch gravity to dodge approaching obstacles.</p><section class="frame"><div class="hud"><span>SCORE <b id="score">0</b></span><span>BEST <b id="best">0</b></span><span id="lives">READY</span></div><canvas id="game" width="840" height="480" aria-label="Gravity Flip game canvas"></canvas><div class="actions"><button class="primary" id="start">START GAME</button><button id="pause">PAUSE</button></div><p id="msg" class="tip">Keyboard: ← → or A/D · Touch: drag or tap · SPACE: action</p></section><p class="foot">Designed for quick sessions. Your high score is stored on this device.</p></main><script>
(()=>{
"use strict";const c=document.getElementById('game'),x=c.getContext('2d'),W=840,H=480,$=id=>document.getElementById(id);const kind="gravity",accent="#c3a3ff";let run=false,paused=false,score=0,best=0,last=0,t=0,spawn=0,items=[],particles=[],p={x:420,y:380,flip:1},held={left:false,right:false},touchX=null,raf=0;try{best=+(localStorage.getItem('nova-gravity-flip-best')||0)}catch{}$('best').textContent=best;
function rand(a,b){return a+Math.random()*(b-a)}function circle(a,b,r,col){x.fillStyle=col;x.beginPath();x.arc(a,b,r,0,Math.PI*2);x.fill()}function rect(a,b,w,h,col){x.fillStyle=col;x.fillRect(a,b,w,h)}function label(s,a,b,size=24,col='#fff'){x.textAlign='center';x.font='900 '+size+'px system-ui';x.fillStyle=col;x.fillText(s,a,b)}function burst(a,b,col){for(let i=0;i<15;i++)particles.push({x:a,y:b,vx:rand(-5,5),vy:rand(-5,5),life:35,col})}
function points(n){score+=n;$('score').textContent=Math.floor(score);if(score>best){best=Math.floor(score);$('best').textContent=best;try{localStorage.setItem('nova-gravity-flip-best',best)}catch{}}}
function reset(){run=true;paused=false;score=0;t=0;spawn=0;items=[];particles=[];p={x:420,y:kind==='gravity'?420:380,flip:1};$('score').textContent='0';$('lives').textContent='LIVE';$('msg').textContent='Survive. Score. Repeat.';$('start').textContent='RESTART';$('pause').textContent='PAUSE';last=performance.now()}
function end(){run=false;$('lives').textContent='GAME OVER';$('msg').textContent='Run complete — '+Math.floor(score)+' points. Hit RESTART to go again';burst(p.x,p.y,'#ff799b')}
function action(){if(kind==='gravity'&&run&&!paused){p.flip*=-1;p.y=p.flip===1?420:60;burst(p.x,p.y,accent)}}function update(dt){if(!run||paused)return;t+=dt;let velocity=5.8*dt;p.x+=((held.right?1:0)-(held.left?1:0))*velocity;if(touchX!==null)p.x+=(touchX-p.x)*Math.min(.23*dt,1);p.x=Math.max(25,Math.min(W-25,p.x));
spawn-=dt;if(spawn<=0){spawn=Math.max(12,39-t/110);if(kind==='dash')items.push({x:rand(100,740),y:-35,w:rand(55,140),v:rand(3.5,6)+t/400,type:1});else if(kind==='harvest')items.push({x:rand(34,806),y:-30,v:rand(3,6)+t/500,type:Math.random()<.66?0:1});else items.push({x:870,y:Math.random()<.5?420:60,v:rand(4.5,7)+t/460,type:1})}
for(let i=items.length-1;i>=0;i--){let a=items[i];if(kind==='gravity')a.x-=a.v*dt;else a.y+=a.v*dt;const hit=kind==='dash'?Math.abs(a.y-p.y)<27&&Math.abs(a.x-p.x)<a.w/2+17:kind==='harvest'?Math.hypot(a.x-p.x,a.y-p.y)<32:Math.abs(a.x-p.x)<40&&Math.abs(a.y-p.y)<32;
if(hit){if(kind==='harvest'&&a.type===0){points(20);burst(a.x,a.y,'#ffe18e');items.splice(i,1);continue}else{end();return}}
if(a.y>H+50||a.x<-90){items.splice(i,1);if(kind!=='harvest')points(5)}}if(kind==='harvest'||kind==='gravity')points(.055*dt);else points(.025*dt);
particles.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt});particles=particles.filter(q=>q.life>0)}
function draw(now){const bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0b1734');bg.addColorStop(1,'#070d19');x.fillStyle=bg;x.fillRect(0,0,W,H);for(let i=0;i<80;i++){let sx=(i*163+51)%W,sy=(i*93+Math.floor(now/100)*(i%3))%H;rect(sx,sy,1.5,1.5,'#8aa6cc55')}x.strokeStyle='#4b71942a';for(let i=0;i<W;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let j=0;j<H;j+=40){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke()}if(kind==='gravity'){rect(0,26,W,7,accent);rect(0,447,W,7,accent);for(let a of items){circle(a.x,a.y,25,'#ff799b33');circle(a.x,a.y,19,'#ff799b');label('✕',a.x,a.y+8,25,'#380f22')}}else for(let a of items){if(kind==='harvest'&&a.type===0){circle(a.x,a.y,28,'#ffd88733');label('✧',a.x,a.y+12,41,'#ffdd8f')}else if(kind==='harvest'){circle(a.x,a.y,25,'#ff698a44');label('✕',a.x,a.y+11,33,'#ff7594')}else{rect(a.x-a.w/2-6,a.y-17,a.w+12,34,'#fe557d33');rect(a.x-a.w/2,a.y-13,a.w,26,'#ff7099');rect(a.x-a.w/2+6,a.y-8,a.w-12,5,'#ffd0de')}}
circle(p.x,p.y,42,accent+'22');x.shadowColor=accent;x.shadowBlur=22;circle(p.x,p.y,18,accent);x.shadowBlur=0;label(kind==='gravity'?'⇅':kind==='dash'?'◆':'✦',p.x,p.y+9,26,'#091522');for(let q of particles){x.globalAlpha=Math.max(0,q.life/35);circle(q.x,q.y,3,q.col)}x.globalAlpha=1;if(!run){rect(0,0,W,H,'#02061588');label(score?'RUN COMPLETE':'GRAVITY FLIP',W/2,210,43,'#fff');label('PRESS START TO PLAY',W/2,252,17,accent)}else if(paused){rect(0,0,W,H,'#03081499');label('PAUSED',W/2,238,47,'#fff')}}
function loop(now){const dt=Math.min((now-last)/16.667||1,2);last=now;update(dt);draw(now);raf=requestAnimationFrame(loop)}$('start').onclick=reset;$('pause').onclick=()=>{if(!run)return;paused=!paused;$('pause').textContent=paused?'RESUME':'PAUSE';$('lives').textContent=paused?'PAUSED':'LIVE'};window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','ArrowUp'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')held.left=true;if(e.key==='ArrowRight'||e.key==='d')held.right=true;if((e.key===' '||e.key==='ArrowUp')&&!e.repeat)action();if(e.key.toLowerCase()==='p')$('pause').click()});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')held.left=false;if(e.key==='ArrowRight'||e.key==='d')held.right=false});c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect();touchX=(e.clientX-r.left)*W/r.width;if(kind==='gravity')action()});c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch'){let r=c.getBoundingClientRect();touchX=(e.clientX-r.left)*W/r.width}});window.addEventListener('pointerup',()=>touchX=null);document.addEventListener('visibilitychange',()=>{if(document.hidden&&run&&!paused)$('pause').click()});last=performance.now();raf=requestAnimationFrame(loop);
})();
</script></body></html>
