var pads=$("pads");function pad(t,cmd){var b=document.createElement("button");b.textContent=t;b.onclick=function(){action(cmd)};pads.appendChild(b);return b}
if(mode===0)pad("↕ FLIP","act");
if([1,2,6,9].includes(mode)){var l=pad("◀ LEFT","left"),r=pad("RIGHT ▶","right");if(mode===2){l.onpointerdown=function(){keys.l=true};r.onpointerdown=function(){keys.r=true};l.onpointerup=r.onpointerup=function(){keys.l=false;keys.r=false}}}
if(mode===6){pad("▲ UP","up");pad("▼ DOWN","down")}
if(mode===3){pad("⚑ FLAG MODE","flag").onclick=function(){state.flag=!state.flag}}

canvas.addEventListener("pointerdown",function(e){if(!run)return;var b=canvas.getBoundingClientRect(),px=(e.clientX-b.left)/b.width*800,py=(e.clientY-b.top)/b.height*480;if([3,7,11].includes(mode))action("tap",px,py);else if([0,5].includes(mode))action("act");else if(mode===1)action("tap",px);else if(mode===4)action((px>400?1:0)+(py>250?2:0));else if(mode===8)action(clamp(Math.floor((px-110)/148),0,3))});
window.addEventListener("keydown",function(e){if(e.target.tagName==="INPUT")return;var k=e.key.toLowerCase(),cmd={arrowleft:"left",a:"left",arrowright:"right",d:"right",arrowup:"up",w:"up",arrowdown:"down",s:"down"," ":"act"}[k];if(["arrowleft","arrowright","arrowup","arrowdown"," "].includes(k))e.preventDefault();if(mode===4&&/^[1-4]$/.test(k))action(Number(k)-1);else if(mode===8&&"dfjk".includes(k)&&k.length===1)action("dfjk".indexOf(k));else if(cmd){if(mode===2&&(cmd==="left"||cmd==="right"))keys[cmd==="left"?"l":"r"]=true;else action(cmd)}});
window.addEventListener("keyup",function(e){if(e.key==="ArrowLeft"||e.key==="a")keys.l=false;if(e.key==="ArrowRight"||e.key==="d")keys.r=false});
function loop(t){var dt=Math.min((t-last||16)/1000,.05);last=t;if(run)update(dt);render();requestAnimationFrame(loop)}last=performance.now();requestAnimationFrame(loop);render();
})();
