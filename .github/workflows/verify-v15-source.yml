name: Verify standalone NOVA ARCADE source
on:
  push:
    branches: [main]
    paths:
      - "games/**"
      - "art/**"
      - "index.html"
      - "style.css"
      - "arcade.js"
      - "scripts/verify-v15-source.mjs"
      - ".github/workflows/verify-v15-source.yml"
  pull_request:
    paths:
      - "games/**"
      - "art/**"
      - "index.html"
      - "style.css"
      - "arcade.js"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate arcade source
        run: node scripts/verify-v15-source.mjs
